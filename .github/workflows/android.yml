# Builds the Android app (an APK you can install directly) from the game and publishes it as the release "android".
# Runs on every push to hustlelife that touches the game, or by hand from the Actions tab.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [hustlelife]
    paths: ['v2/src/**', 'v2/public/**', 'v2/index.html', 'android/**', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build the game
        working-directory: v2
        run: npm ci && npx vite build && rm -rf dist/devm
      - name: Wrap it as an Android app
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          rm -rf www && cp -r ../v2/dist www
          npx cap add android
          node patch-android.mjs
          npx cap sync android
      - name: Build the APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/android/app/build/outputs/apk/debug/app-debug.apk HustleLife.apk
          gh release delete android -y --cleanup-tag || true
          gh release create android HustleLife.apk --title "HustleLife for Android" --notes "Built from ${GITHUB_SHA::7}. On your phone: download HustleLife.apk, open it, allow installing from this source, install." --target "$GITHUB_SHA"
